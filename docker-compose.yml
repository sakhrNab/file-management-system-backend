version: '3.8'

services:
  # Backend API - File Manager
  backend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.backend
    container_name: file_manager_backend_prod
    environment:
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin123}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-this-in-production}
      - BASE_URL=${BASE_URL:-https://drive.aiwaverider.com}
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8003:8003"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    # Enhanced restart policy for 503 errors and unreachable states
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    # Health check - more aggressive monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Additional settings for stability
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - file_manager_network


networks:
  file_manager_network:
    driver: bridge
