
services:
  # Backend API - File Manager
  backend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.backend
    # Coolify will manage container naming and labels
    environment:
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin123}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-this-in-production}
      - BASE_URL=${BASE_URL:-https://drive.aiwaverider.com}
      - UPLOAD_DIR=/app/uploads
    # Use expose instead of ports to avoid host port collisions
    # Coolify/Traefik will handle external routing
    expose:
      - "8003"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    # Health check for container monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Graceful shutdown period
    stop_grace_period: 30s
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Traefik labels for external routing (Coolify will add these)
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`drive-backend.aiwaverider.com`)
      - traefik.http.routers.backend.entrypoints=https
      - traefik.http.services.backend.loadbalancer.server.port=8003
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
    networks:
      - file_manager_network

networks:
  file_manager_network:
    driver: bridge
    # Note: Coolify will manage external networks
    # If you need external network, use: external: true
